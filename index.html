<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo1.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>MySpine - Centar za fizikalnu terapiju Smederevo</title>
    <meta name="description" content="MySpine ordinacija za fizikalnu terapiju, masažu i rehabilitaciju u Smederevu. Stručni tim terapeuta, besplatan pregled, moderne metode lečenja." />
    <meta name="keywords" content="fizikalna terapija, masaža, kičma, leđa, rehabilitacija, myspine, smederevo, fizioterapeut" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="MySpine - Centar za fizikalnu terapiju" />
    <meta property="og:description" content="Stručna nega kičme i fizikalna terapija u Smederevu" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myspine.rs/" />
    
    <!-- DNS Prefetch za brže učitavanje -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS - inline za brzi prvi prikaz -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Placeholder za YouTube video */
      .youtube-facade {
        position: relative;
        padding-bottom: 56.25%;
        background: #000;
        cursor: pointer;
      }
      
      .youtube-facade img {
        width: 100%;
        height: 100%;
        position: absolute;
        object-fit: cover;
      }
      
      .youtube-play-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 68px;
        height: 48px;
        background: rgba(255,0,0,0.8);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    
    <!-- Asinhrono učitaj Google Fonts - NE blokira renderovanje -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" />
    </noscript>
    
    <!-- Canonical -->
    <link rel="canonical" href="https://myspine.rs/" />
    
    <!-- Robots -->
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
